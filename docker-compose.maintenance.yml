# docker-compose.maintenance.yml — page de maintenance pour cryptokilla.
# (Chap 20/23, round sécurisation)
#
# PAS un override de docker-compose.yml (aucune fusion) : un fichier de
# compose AUTONOME, invoqué SEUL (lifecycle-fleet.sh, shared_services) une
# fois que `docker compose down` a arrêté le frontend/backend réels. Les deux
# ne tournent JAMAIS en même temps — ils réclament les mêmes routes Traefik
# (Host(`cryptokilla.com`) et Host(`api.cryptokilla.com`)), qu'un
# seul jeu de conteneurs à la fois peut servir.
#
# Un seul conteneur statique (nginx, aucun build) sert la même page sur les
# deux domaines : pendant une vraie coupure, le frontend ET l'API sont hors
# service, pas la peine de distinguer les deux messages.
#
# Ne pas éditer à la main : modifier le template du générateur.
services:
  maintenance:
    image: nginx:alpine
    container_name: cryptokilla_maintenance
    restart: unless-stopped
    volumes:
      - ./maintenance/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maintenance-cryptokilla-front.rule=Host(`cryptokilla.com`)"
      - "traefik.http.routers.maintenance-cryptokilla-front.entrypoints=websecure"
      - "traefik.http.routers.maintenance-cryptokilla-front.tls.certresolver=letsencrypt"
      - "traefik.http.routers.maintenance-cryptokilla-front.service=maintenance-cryptokilla"
      - "traefik.http.routers.maintenance-cryptokilla-api.rule=Host(`api.cryptokilla.com`)"
      - "traefik.http.routers.maintenance-cryptokilla-api.entrypoints=websecure"
      - "traefik.http.routers.maintenance-cryptokilla-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.maintenance-cryptokilla-api.service=maintenance-cryptokilla"
      - "traefik.http.services.maintenance-cryptokilla.loadbalancer.server.port=80"

networks:
  proxy-net:
    external: true
    name: proxy-net
